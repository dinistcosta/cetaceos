<style>
/* Layout: catálogo em grelha de fichas, com filtros numa linha por cima; mesmos tokens da página de análise. */
:root {
  --bg: #f4f7f8; --surface: #fdfefe; --ink: #0f1b26; --ink-2: #4b5a68; --ink-3: #7a8794;

  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c141b; --surface: #111c25; --ink: #e6edf2; --ink-2: #a3b3c1; --ink-3: #718292;
    --line: #22313d; --accent: #6da7ec; --h4: #5598e7; --h6: #dcebfd; --photo-bg: #1a2731;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c141b; --surface: #111c25; --ink: #e6edf2; --ink-2: #a3b3c1; --ink-3: #718292;
  --line: #22313d; --accent: #6da7ec; --h4: #5598e7; --h6: #dcebfd; --photo-bg: #1a2731;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; padding-inline: 16px; padding-block: 0 4rem; }
.wrap { max-width: 72rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
.wrap > * { min-width: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
.eyebrow, .label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 1.25rem; flex-wrap: wrap; }
.nav { display: flex; gap: 1.25rem; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.nav a { color: var(--ink-2); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.nav a:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { font: 500 0.78rem var(--mono); letter-spacing: 0.06em; color: var(--ink-2); background: transparent; border: 0; padding: 0.3rem 0.75rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

header.hero { padding-top: clamp(1rem, 4vw, 2.5rem); display: grid; gap: 1.25rem; }
.lead { font-size: 1.15rem; color: var(--ink-2); max-width: 40rem; }

/* resumo da Lista Vermelha: uma barra empilhada com as categorias */
.rl { display: grid; gap: 0.5rem; max-width: 46rem; }
.rl-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--bg); }
.rl-bar button { border: 0; padding: 0; cursor: pointer; font: 700 0.75rem var(--mono); color: #0f1b26; min-width: 22px; }
.rl-bar button[aria-pressed="false"].dim { opacity: 0.3; }
.rl-key { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; font-family: var(--mono); font-size: 0.75rem; color: var(--ink-2); }
.rl-key span { display: inline-flex; align-items: center; gap: 0.35rem; }
.rl-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.filters { display: flex; flex-wrap: wrap; gap: 1rem 1.75rem; align-items: flex-end; padding-block: 1rem; border-block: 1px solid var(--line); }
.control { display: grid; gap: 0.4rem; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 0.88rem var(--display); color: var(--ink-2); background: transparent; border: 0; padding: 0.45rem 0.85rem; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select, input[type="search"] { font: 500 0.9rem var(--display); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.6rem; max-width: 100%; }
input[type="search"] { width: 14rem; }
.count { margin-left: auto; font-family: var(--mono); font-size: 0.8rem; color: var(--ink-2); align-self: center; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 1.25rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.photo { position: relative; aspect-ratio: 3 / 2; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo.ilustr { background: #f4f6f7; }
.photo.ilustr img { object-fit: contain; padding: 0.5rem; }
.photo svg { width: 70%; color: var(--ink-3); }
.badge { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 0.4rem; background: rgb(15 27 38 / 0.82); color: #f4f7f8; border-radius: 6px; padding: 0.2rem 0.5rem 0.2rem 0.25rem; font: 500 0.72rem var(--mono); }
.badge b { font-weight: 700; color: #0f1b26; border-radius: 4px; padding: 0.05rem 0.35rem; }
.body { padding: 0.9rem 1rem 1rem; display: grid; gap: 0.6rem; align-content: start; }
.names h2 { font-size: 1.12rem; font-weight: 700; }
.names .sci { font-style: italic; color: var(--ink-2); font-size: 0.95rem; }
.taxo { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-3); }
.obs { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; font-family: var(--mono); font-size: 0.75rem; color: var(--ink-2); }
.obs b { color: var(--ink); font-weight: 500; }
.spark { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; align-items: end; height: 30px; }
.spark span { background: var(--h4); border-radius: 2px 2px 0 0; min-height: 1px; }
.spark span.pk { background: var(--h6); }
.spark-l { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.62rem; color: var(--ink-3); margin-top: -0.3rem; }
.credit { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-3); overflow-wrap: anywhere; line-height: 1.4; }
.credit a { color: var(--ink-3); }
.links { display: flex; gap: 1rem; font-family: var(--mono); font-size: 0.75rem; }
.empty { grid-column: 1 / -1; padding: 3rem 0; text-align: center; font-family: var(--mono); color: var(--ink-2); }
footer { border-top: 1px solid var(--line); padding-top: 1.25rem; font-family: var(--mono); font-size: 0.78rem; color: var(--ink-3); display: grid; gap: 0.5rem; }
@media (max-width: 560px) { input[type="search"] { width: 100%; } .count { margin-left: 0; } }
</style>

<script>
(function () {
  const E = window.ESPECIES;            // [{s, fam, sub, total, reg: {Açores, Madeira, Continente}, meses: [12], foto, credito}]
  const C = window.COMUM;
  const ORDEM_RL = ["CR", "EN", "VU", "NT", "LC", "DD"];
  const T = {
    pt: {
      navA: "Análise", navE: "Espécies", eye: "Catálogo · Lista Vermelha da UICN",
      h1: n => `As ${n} espécies observadas em Portugal`,
      lead: "Todas as espécies de cetáceos com observações registadas no GBIF entre 2000 e 2026, com o estado de conservação global, o número de observações em cada região e o mês em que são mais vistas.",
      rlTitle: "Estado de conservação global · clique numa categoria para filtrar",
      fGrupo: "Grupo", fOrd: "Ordenar", fProc: "Procurar",
      grupos: { todas: "Todas", mys: "Baleias de barbas", odo: "Com dentes" },
      ord: { obs: "Mais observadas", nome: "Nome", rl: "Mais ameaçadas" },
      ph: "nome comum ou científico",
      count: (n, t) => n === t ? `${n} espécies` : `${n} de ${t} espécies`,
      sub: { mys: "Misticetos (baleias de barbas)", odo: "Odontocetos (com dentes)" },
      obs: "observações", pico: m => `pico em ${m}`, sem: "sem registos",
      reg: { "Açores": "Açores", "Madeira": "Madeira", "Continente": "Continente" },
      meses: ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"],
      mesesL: ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"],
      foto: "Foto", ilustr: "Ilustração", semAutor: "autor não indicado", semFoto: "Sem foto com licença livre; silhueta do grupo.",
      iucnLink: "Ver na Lista Vermelha", vazio: "Nenhuma espécie corresponde a estes filtros.",
      foot1: "Estado de conservação: avaliação global da Lista Vermelha da UICN (iucnredlist.org). Confirme sempre a avaliação mais recente.",
      foot2: "Fotos: Wikimedia Commons, com o autor e a licença indicados em cada ficha. Observações: GBIF.org (7 October 2026) https://doi.org/10.15468/dl.mzf9rc"
    },
    en: {
      navA: "Analysis", navE: "Species", eye: "Catalogue · IUCN Red List",
      h1: n => `The ${n} species recorded in Portugal`,
      lead: "Every cetacean species with sightings recorded on GBIF between 2000 and 2026, with its global conservation status, the number of sightings in each region and the month when it is seen most.",
      rlTitle: "Global conservation status · click a category to filter",
      fGrupo: "Group", fOrd: "Sort", fProc: "Search",
      grupos: { todas: "All", mys: "Baleen whales", odo: "Toothed" },
      ord: { obs: "Most sighted", nome: "Name", rl: "Most threatened" },
      ph: "common or scientific name",
      count: (n, t) => n === t ? `${n} species` : `${n} of ${t} species`,
      sub: { mys: "Mysticetes (baleen whales)", odo: "Odontocetes (toothed)" },
      obs: "sightings", pico: m => `peak in ${m}`, sem: "no records",
      reg: { "Açores": "Azores", "Madeira": "Madeira", "Continente": "Mainland" },
      meses: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
      mesesL: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
      foto: "Photo", ilustr: "Illustration", semAutor: "author not given", semFoto: "No freely licensed photo; group silhouette.",
      iucnLink: "See on the Red List", vazio: "No species match these filters.",
      foot1: "Conservation status: IUCN Red List global assessment (iucnredlist.org). Always check the latest assessment.",
      foot2: "Photos: Wikimedia Commons, with author and licence shown on each card. Sightings: GBIF.org (7 October 2026) https://doi.org/10.15468/dl.mzf9rc"
    }
  };
  let lang = "pt";
  try { const g = localStorage.getItem("cet-lang"); if (g === "en" || g === "pt") lang = g; } catch (e) {}
  const t = k => T[lang][k];
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString(lang === "pt" ? "pt-PT" : "en-GB");
  const nome = s => C.nomes[lang][s] || s;
  const rl = s => C.iucn[s] || "LC";
  const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const estado = { grupo: "todas", ord: "obs", rl: null, q: "" };

  function silhueta(s) { const d = window.ICONES[window.GRUPO[s]]; return d ? `<svg viewBox="0 0 64 24" aria-hidden="true"><path d="${d}" fill="currentColor"/></svg>` : ""; }

  function textos() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { const v = t(el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
    $("h1").textContent = t("h1")(E.length);
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("seg-grupo").innerHTML = ["todas", "mys", "odo"].map(g => `<button type="button" data-g="${g}" aria-pressed="${g === estado.grupo}">${t("grupos")[g]}</button>`).join("");
    $("sel-ord").innerHTML = ["obs", "nome", "rl"].map(o => `<option value="${o}"${o === estado.ord ? " selected" : ""}>${t("ord")[o]}</option>`).join("");
    $("procurar").placeholder = t("ph");
    $("rl-bar").setAttribute("aria-label", t("rlTitle"));
  }

  function resumoRL() {
    const n = {}; ORDEM_RL.forEach(c => n[c] = 0); E.forEach(e => n[rl(e.s)]++);
    $("rl-bar").innerHTML = ORDEM_RL.filter(c => n[c]).map(c =>
      `<button type="button" data-c="${c}" aria-pressed="${estado.rl === c}" class="${estado.rl && estado.rl !== c ? "dim" : ""}" style="flex:${n[c]} 1 0;background:${C.cor[c]}" title="${C.rotulos[lang][c]}: ${n[c]}">${c}</button>`).join("");
    $("rl-key").innerHTML = ORDEM_RL.filter(c => n[c]).map(c => `<span><i style="background:${C.cor[c]}"></i>${c} · ${C.rotulos[lang][c]} · <b>${n[c]}</b></span>`).join("");
  }

  function cartao(e) {
    const c = rl(e.s), comum = nome(e.s), meses = t("meses");
    const max = Math.max(...e.meses), pk = e.meses.indexOf(max);
    const spark = e.meses.map((v, j) => `<span class="${j === pk ? "pk" : ""}" style="height:${max ? Math.max(3, v / max * 100).toFixed(1) : 3}%" title="${t("mesesL")[j]}: ${fmt(v)}"></span>`).join("");
    const regs = ["Açores", "Madeira", "Continente"].map(r => `<span>${t("reg")[r]} <b>${e.reg[r] ? fmt(e.reg[r]) : "–"}</b></span>`).join("");
    const foto = e.foto
      ? `<img src="${e.foto}" alt="${esc(comum)} (${e.s})" loading="lazy">`
      : silhueta(e.s);
    const cred = e.foto && e.credito
      ? `${e.ilustr ? t("ilustr") : t("foto")}: ${esc(e.credito.autor || t("semAutor"))} · <a href="${esc(e.credito.pagina)}" target="_blank" rel="noopener">${esc(e.credito.licenca)}</a>, Wikimedia Commons`
      : t("semFoto");
    const iucnUrl = "https://www.iucnredlist.org/search?query=" + encodeURIComponent(e.s);
    return `<article class="card">
      <div class="photo${e.ilustr ? " ilustr" : ""}">${foto}<span class="badge"><b style="background:${C.cor[c]}">${c}</b>${C.rotulos[lang][c]}</span></div>
      <div class="body">
        <div class="names"><h2>${esc(comum)}</h2><span class="sci">${e.s}</span></div>
        <span class="taxo">${e.fam} · ${t("sub")[e.sub]}</span>
        <div class="obs"><span><b>${fmt(e.total)}</b> ${t("obs")}</span><span>${max ? t("pico")(t("mesesL")[pk]) : t("sem")}</span></div>
        <div class="obs">${regs}</div>
        <div class="spark" aria-hidden="true">${spark}</div>
        <div class="spark-l" aria-hidden="true"><span>${meses[0]}</span><span>${meses[5]}</span><span>${meses[11]}</span></div>
        <div class="links"><a href="${iucnUrl}" target="_blank" rel="noopener">${t("iucnLink")} ↗</a></div>
        <p class="credit">${cred}</p>
      </div>
    </article>`;
  }

  function desenhar() {
    const q = estado.q.trim().toLowerCase();
    let lista = E.filter(e =>
      (estado.grupo === "todas" || e.sub === estado.grupo) &&
      (!estado.rl || rl(e.s) === estado.rl) &&
      (!q || e.s.toLowerCase().includes(q) || nome(e.s).toLowerCase().includes(q) ||
       C.nomes.pt[e.s]?.toLowerCase().includes(q) || C.nomes.en[e.s]?.toLowerCase().includes(q)));
    if (estado.ord === "obs") lista.sort((a, b) => b.total - a.total);
    if (estado.ord === "nome") lista.sort((a, b) => nome(a.s).localeCompare(nome(b.s), lang));
    if (estado.ord === "rl") lista.sort((a, b) => ORDEM_RL.indexOf(rl(a.s)) - ORDEM_RL.indexOf(rl(b.s)) || b.total - a.total);
    $("grid").innerHTML = lista.length ? lista.map(cartao).join("") : `<p class="empty">${t("vazio")}</p>`;
    $("count").textContent = t("count")(lista.length, E.length);
  }

  $("seg-grupo").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; estado.grupo = b.dataset.g;
    $("seg-grupo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); desenhar(); });
  $("sel-ord").addEventListener("change", e => { estado.ord = e.target.value; desenhar(); });
  $("procurar").addEventListener("input", e => { estado.q = e.target.value; desenhar(); });
  $("rl-bar").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    estado.rl = estado.rl === b.dataset.c ? null : b.dataset.c; resumoRL(); desenhar(); });
  document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; try { localStorage.setItem("cet-lang", lang); } catch (err) {} tudo(); });

  function tudo() { textos(); resumoRL(); desenhar(); }
  tudo();
})();
</script>
</body>
</html>
